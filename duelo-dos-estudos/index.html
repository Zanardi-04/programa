<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duelo dos Estudos</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0c172a;color:#fff}main{max-width:670px;margin:auto;padding:20px 14px 55px}.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}.logo{background:#27436b;border-radius:13px;padding:12px;font-size:25px}.top h1{font-size:21px;margin:0}.sub,.muted{color:#afc1da;font-size:12px}.top .cup{margin-left:auto;font-size:26px}.profiles{display:flex;background:#1c304d;border-radius:13px;padding:5px;gap:4px;margin-bottom:13px}button{cursor:pointer;color:#fff;font:inherit;border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #a9d4ff;outline-offset:2px}.profiles button{flex:1;background:transparent;padding:12px 5px;border-radius:10px;font-weight:650;font-size:13px}.profiles button.active{background:#315f9d}.panel{background:#1c304d;border-radius:16px;padding:17px;margin-bottom:13px}.panel h2{font-size:16px;margin:0 0 13px}.score{display:flex;align-items:center;justify-content:space-between;gap:8px}.score .side{flex:1}.score .side:last-child{text-align:right}.score .num{font-size:29px;font-weight:800}.score .vs{color:#f5ca68;font-weight:700}.track{height:8px;background:#34455f;border-radius:9px;overflow:hidden;margin-top:15px}.track span{display:block;height:100%;background:#6ba7ff;border-radius:9px}.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{text-align:left;min-height:118px;padding:15px;background:#243b5b;border-radius:15px;display:flex;flex-direction:column;gap:7px}.tile:first-child{background:#285aa0}.tile .ico{font-size:24px}.tile strong{font-size:14px}.tile small{font-size:11px;color:#b9c9df}.back,.primary,.secondary{padding:11px 15px;border-radius:10px;background:#315f9d;font-weight:650;font-size:13px}.secondary,.back{background:#294363}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#294363;text-align:center;border-radius:10px;padding:12px 4px}.stat strong{display:block;font-size:23px}.stat small{font-size:11px;color:#c1d0e4}.history{padding:13px 0;border-top:1px solid #344b68}.history:first-of-type{border:0}.ok{color:#9debc3}.bad{color:#ffb5bf}.option{display:block;background:#294363;padding:13px;border-radius:10px;margin:8px 0;font-size:14px}.option:has(input:checked){outline:2px solid #8bb7ff}.option input{accent-color:#8bb7ff}.qtext{line-height:1.6;font-size:14px}.nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.nums button{padding:8px 11px;background:#294363;border-radius:8px}.nums button.active{background:#4275ba}.subject{width:100%;background:#294363;border:0;border-radius:10px;padding:11px;color:white}.notice{font-size:12px;color:#b7c9e2;line-height:1.5;margin-top:15px}.review-choice{display:flex;gap:8px}.review-choice button{flex:1;background:#294363;border-radius:10px;padding:12px 5px}.review-choice button.selected{background:#286d55}.review-choice button.wrong{background:#75404c}.pill{font-size:11px;color:#b7c9e2}.result{background:#294363;padding:13px;border-radius:12px;margin-top:12px}.footer{font-size:11px;color:#90a6c6;text-align:center;margin-top:18px}@media(min-width:600px){main{padding-top:34px}.tile{min-height:125px}}
</style></head><body><main><header class="top"><div class="logo">🎓</div><div><h1>Duelo dos Estudos</h1><div class="sub">Estude • Revise • Vença</div></div><div class="cup">🏆</div></header><div id="app"></div><div class="footer">Progresso salvo neste navegador • Sem sincronização entre celulares</div></main><script>
const questions=[{"id": 1, "subject": "Direitos Humanos", "text": "O Presidente da República celebrou tratado internacional no qual os Estados celebrantes se comprometiam a oferecer condições adequadas, no ambiente prisional, às mulheres grávidas que se encontrassem presas. Esse tratado foi aprovado pelas Casas do Congresso Nacional e regularmente promulgado na ordem jurídica interna. À luz da sistemática constitucional, o tratado internacional assim aprovado é equivalente:", "options": {"A": "ao ato infralegal, pois a sua promulgação na ordem interna se dá por meio de decreto;", "B": "à lei ordinária, pois todo tratado internacional possui essa natureza jurídica;", "C": "ao ato nulo, pois somente o Senado Federal possui competência para aprovar tratado internacional;", "D": "à emenda constitucional, desde que aprovado em dois turnos, por três quintos dos votos dos membros das Casas;", "E": "à lei complementar, desde que aprovado pela maioria absoluta dos membros das Casas."}, "answer": "D", "needs_review": false}, {"id": 2, "subject": "Direitos Humanos", "text": "A respeito da incorporação dos tratados internacionais de direitos humanos, é INCORRETO afirmar:", "options": {"A": "A aprovação pelo Congresso Nacional de um tratado de direitos humanos de acordo com o rito estabelecido no § 3º do art. 5º da Constituição Federal não dispensa a ratificação do tratado.", "B": "Os tratados aprovados pelo Congresso Nacional na forma do art. 5º , § 3º , da Constituição Federal possuem hierarquia e força normativa equivalente às emendas constitucionais.", "C": "Os tratados e convenções internacionais sobre direitos humanos que forem aprovados, em cada Casa do Congresso Nacional, em dois turnos, por três quintos dos votos dos respectivos membros, serão equivalentes às emendas constitucionais.", "D": "Os tratados internacionais que não versam sobre direitos humanos possuem, como regra geral, hierarquia de lei ordinária.", "E": "Os tratados internacionais de direitos humanos dependem de ratificação pelo Brasil, mediante processo de incorporação de atribuição e participação exclusiva do Congresso Nacional."}, "answer": "E", "needs_review": false}, {"id": 3, "subject": "Direitos Humanos", "text": "Assinale a alternativa que contempla um tratado de direitos humanos, incorporado pelo Direito Brasileiro com o status de norma constitucional, que faz parte do que a doutrina chama de Bloco de Constitucionalidade.", "options": {"A": "Pacto Internacional dos Direitos Civis e Políticos.", "B": "Convenção Relativa ao Estatuto dos Refugiados.", "C": "Convenção contra a tortura e outros tratamentos ou penas cruéis, desumanas e degradantes.", "D": "Pacto Internacional dos Direitos Econômicos, Sociais e Culturais."}, "answer": "E", "needs_review": true}, {"id": 4, "subject": "Direitos Humanos", "text": "A respeito dos direitos e garantias fundamentais, é possível afirmar que os tratados e convenções sobre direitos humanos que forem aprovados, em cada casa do Congresso Nacional, em dois turnos, por três quintos dos votos dos respectivos membros, serão equivalentes às (aos):", "options": {"A": "emendas constitucionais.", "B": "leis ordinárias.", "C": "leis complementares.", "D": "decretos legislativos.", "E": "leis delegadas."}, "answer": "A", "needs_review": false}, {"id": 5, "subject": "Direitos Humanos", "text": "De acordo com o art. 5⁰, LXVII, da CRFB/1988, “Não haverá prisão civil por dívida, salvo a do responsável pelo inadimplemento voluntário e inescusável de obrigação alimentar e a do depositário infiel”. A Convenção Americana sobre Direitos Humanos -Pacto de San José da Costa Rica, que proíbe a prisão por dívida decorrente do descumprimento de obrigações contratuais, à qual o Brasil aderiu, foi internalizada com o status de:", "options": {"A": "norma supralegal e infraconstitucional.", "B": "lei complementar.", "C": "norma supraconstitucional.", "D": "norma constitucional.", "E": "lei ordinária."}, "answer": "A", "needs_review": false}, {"id": 6, "subject": "Direitos Humanos", "text": "Considerando a Declaração Universal dos Direitos Humanos (DUDH), é correto afirmar que:", "options": {"A": "A DUDH é de 1969.", "B": "Todo ser humano tem direito à propriedade, apenas em sociedade com outros.", "C": "Ninguém será privado de sua propriedade.", "D": "Ninguém será privado de sua nacionalidade.", "E": "Todo ser humano tem direito a receber dos tribunais nacionais competentes remédio efetivo para os atos que violem os direitos fundamentais que lhe sejam reconhecidos pela constituição ou pela lei."}, "answer": "E", "needs_review": false}, {"id": 7, "subject": "Direitos Humanos", "text": "Considerando a Declaração Universal dos Direitos Humanos (DUDH), assinale a alternativa que completa o trecho a seguir: “Todos são iguais perante a lei e têm direito, sem qualquer distinção, a igual proteção da ______. Todos têm direito a igual proteção contra qualquer discriminação que viole a presente Declaração e contra qualquer incitamento a tal discriminação.”", "options": {"A": "Autoridade Presidencial.", "B": "Organização das Nações Unidas.", "C": "Lei.", "D": "Autoridade Policial.", "E": "Autoridade Judicial."}, "answer": "C", "needs_review": false}, {"id": 8, "subject": "Direitos Humanos", "text": "“Ninguém será arbitrariamente preso, detido ou exilado”, é máxima prevista pelo seguinte documento sobre Direitos Humanos:", "options": {"A": "Carta do Rei João Sem Terra.", "B": "Declaração de Direitos do Homem e do Cidadão.", "C": "Convenção Americana Sobre Direitos Humanos.", "D": "Declaração Universal dos Direitos Humanos.", "E": "Estatuto de Roma do Tribunal Penal Internacional."}, "answer": "D", "needs_review": false}, {"id": 9, "subject": "Direitos Humanos", "text": "Conforme expressa previsão na Declaração Universal dos Direitos Humanos, ninguém:", "options": {"A": "será submetido à tortura.", "B": "será preso, detido ou exilado.", "C": "pode mudar de nacionalidade.", "D": "pode reunir-se sem autorização."}, "answer": "A", "needs_review": false}, {"id": 10, "subject": "Direitos Humanos", "text": "Complete as lacunas, de acordo com a alternativa que reflete o texto da Declaração Universal dos Direitos Humanos: “Artigo I - Todas as pessoas nascem livres e iguais em ________________________. São dotadas de razão e _______________________ e devem agir em relação umas às outras com espírito de ____________________.”", "options": {"A": "Dignidade e direitos – consciência – fraternidade.", "B": "Direitos e deveres – liberdade – solidariedade.", "C": "Direitos e obrigações – convicção – solidariedade.", "D": "Dignidade e obrigações – consciência – harmonia."}, "answer": "A", "needs_review": false}, {"id": 11, "subject": "Direito Administrativo", "text": "A alternativa correta acerca do Direito Administrativo e suas fontes primárias e secundárias é:", "options": {"A": "Como fonte primária do direito temos a jurisprudência, sendo ela um conjunto de decisões, aplicações e interpretações das leis.", "B": "Como fonte primária do direito temos os costumes que norteiam a sociedade e exigem obediência dos administradores aos comandos legais.", "C": "Como fonte primária do direito temos as leis delegadas e as leis ordinárias.", "D": "Como fonte secundária direito temos a doutrina, que por não ter exigência legal, tem pouca utilidade no Direito.", "E": "Como fonte secundária do direito temos as leis complementares e medidas provisórias."}, "answer": "C", "needs_review": false}, {"id": 12, "subject": "Direito Administrativo", "text": "O direito administrativo é um conjunto de normas e princípios que rege a atuação da administração pública. Assinale a opção que indica apenas as fontes do direito administrativo.", "options": {"A": "lei, jurisprudência, normas e regras.", "B": "costumes, regras, jurisprudência e normas.", "C": "jurisprudência, costumes, lei e doutrina.", "D": "normas, lei, doutrina e regras."}, "answer": "C", "needs_review": false}, {"id": 13, "subject": "Direito Administrativo", "text": "A alternativa correta acerca do Direito Administrativo e suas fontes primárias e secundárias é:", "options": {"A": "Como fonte primária do direito temos a jurisprudência, sendo ela um conjunto de decisões, aplicações e interpretações das leis.", "B": "Como fonte primária do direito temos os costumes que norteiam a sociedade e exigem obediência dos administradores aos comandos legais.", "C": "Como fonte primária do direito temos as leis delegadas e as leis ordinárias.", "D": "Como fonte secundária direito temos a doutrina, que por não ter exigência legal, tem pouca utilidade no Direito.", "E": "Como fonte secundária do direito temos as leis complementares e medidas provisórias."}, "answer": "C", "needs_review": false}, {"id": 14, "subject": "Direito Administrativo", "text": "É considerada fonte primária do Direito Administrativo:", "options": {"A": "A lei.", "B": "A doutrina.", "C": "A jurisprudência.", "D": "Os costumes administrativos."}, "answer": "A", "needs_review": false}, {"id": 15, "subject": "Direito Administrativo", "text": "Em relação ao Direito Administrativo, assinale a alternativa correta:", "options": {"A": "Em razão da aplicação do princípio da legalidade, o costume não pode servir como fonte do direito administrativo.", "B": "A doutrina elenca com mutação do direito administrativo somente a constitucionalização e o princípio da juridicidade e a elasticidade do direito administrativo.", "C": "O sistemas administrativos compreendem os mecanismos utilizados pelos diversos países para o controle jurisdicional da atuação administrativa. O Brasil quanto ao referido sistema adotou o sistema de jurisdição uma (unicidade de jurisdição), de origem inglesa e norte-americana, assim confere ao Poder Judiciário a prerrogativa de decidir da maneira definitiva sobre a juridicidade de todos os atos praticados por particulares ou pela Administração Pública.", "D": "O Poder Executivo, ao editar Medidas Provisórias, exerce sua função típica administrativa."}, "answer": "C", "needs_review": false}, {"id": 16, "subject": "Direito Administrativo", "text": "A ciência do Direito é um ramo do conhecimento que estuda, dentre outros temas, as normas obrigatórias que controlam as relações dos indivíduos em uma sociedade. Nesse campo do saber, está compreendido um conjunto harmônico de princípios jurídicos que regem os órgãos públicos, os agentes e as atividades públicas, tendentes a realizar concreta, direta e imediatamente os fins desejados pelo Estado. Esse ramo do direito possui como fonte primária:", "options": {"A": "A lei, entendida em sentido amplo.", "B": "Os costumes, visto que forma a base da moralidade.", "C": "Os deveres morais, que são reflexos dos anseios sociais.", "D": "A jurisprudência, especialmente as súmulas vinculantes.", "E": "A doutrina, quando consagrada pela crítica especializada."}, "answer": "A", "needs_review": false}, {"id": 17, "subject": "Direito Administrativo", "text": "A prefeitura do Município de Caraguatatuba decidiu criar uma entidade administrativa, com personalidade jurídica de direito público, destinada à prestação de serviços médicos e hospitalares para a população. Tendo isso em vista, foi imediatamente editada lei específica, proposta pelo próprio prefeito, criando essa entidade. Diante do exposto, assinale a opção que apresenta a estrutura que se enquadra nessas características.", "options": {"A": "Autarquia.", "B": "Sociedade de Economia Mista.", "C": "Organização Social.", "D": "Empresa Pública.", "E": "Ministério."}, "answer": "A", "needs_review": false}, {"id": 18, "subject": "Direito Administrativo", "text": "Com relação à administração direta e indireta, avalie as afirmativas a seguir e assinale (V) para afirmativa verdadeira e (F) para falsa. ( ) A administração pública indireta é composta por entidades com personalidade jurídica própria como autarquias, fundações públicas, tribunais de contas, câmaras municipais e assembleias legislativas. ( ) A administração pública indireta é formada por entidades com personalidade jurídica própria e autonomia administrativa, financeira e patrimonial, como autarquias e fundações públicas de direito público que são criadas ou autorizadas por lei específica. ( ) Sociedades de economia mista na administração indireta podem explorar atividade econômica sem submissão a controle da administração direta, priorizando regime de direito privado completo para flexibilidade operacional, dispensando fiscalização de finalidade pública. As afirmativas são, respectivamente,", "options": {"A": "F – V – F.", "B": "V – V – F.", "C": "F – V – V.", "D": "F – F – V.", "E": "V – F – V."}, "answer": "A", "needs_review": false}, {"id": 19, "subject": "Direito Administrativo", "text": "Para executar sua atividade administrativa de forma plena, o Estado divide sua atuação em unidades de poder menores e mais especializadas. Assinale a afirmativa correta acerca da diferença principal entre desconcentração e descentralização.", "options": {"A": "A desconcentração cria entidades com personalidade jurídica, enquanto a descentralização cria órgãos sem personalidade jurídica.", "B": "A descentralização cria órgãos subordinados hierarquicamente à Administração Direta, enquanto a desconcentração cria entidades independentes.", "C": "A desconcentração cria órgãos dentro da mesma pessoa jurídica e sem personalidade jurídica, enquanto a descentralização cria entidades com personalidade jurídica própria.", "D": "Tanto a desconcentração quanto a descentralização criam entidades autônomas com personalidade jurídica própria.", "E": "A descentralização não se aplica ao Direito Administrativo, enquanto a desconcentração é seu único modelo de organização."}, "answer": "C", "needs_review": false}, {"id": 20, "subject": "Direito Administrativo", "text": "Para garantir a plena execução de sua atividade administrativa e a prestação eficiente dos serviços públicos à população, o Estado organiza sua atuação em unidades de poder menores e mais especializadas. Assinale a opção que apresenta uma característica da desconcentração.", "options": {"A": "Transferência de competências para entidades dotadas de personalidade jurídica própria, que atuam de maneira independente do poder hierárquico do Estado.", "B": "Descentralização administrativa, em que o Estado delega a execução de políticas públicas a entidades privadas ou entes autônomos.", "C": "Execução direta de políticas públicas pelo Estado, sem subdivisão ou delegação de competências.", "D": "Distribuição de competências dentro da mesma pessoa jurídica por meio da criação de órgãos públicos sem personalidade jurídica própria.", "E": "Extinção de órgãos públicos e concentração de poder na Administração Direta, visando maior eficiência administrativa."}, "answer": "D", "needs_review": false}, {"id": 31, "subject": "Legislação Extravagante", "text": "Configura hipótese de delito de abuso de autoridade:", "options": {"A": "a busca domiciliar iniciada durante o dia que se estenda para depois das 21h;", "B": "proceder à obtenção de prova, em procedimento de investigação, apenas aparentemente lícita;", "C": "proceder à obtenção de prova, em procedimento de fiscalização, apenas aparentemente lícita;", "D": "a investigação preliminar de fato ou o recebimento de notícia de fato de natureza criminal;", "E": "estender injustificadamente a investigação, procrastinando-a em prejuízo do investigado."}, "answer": "E", "needs_review": false}, {"id": 32, "subject": "Legislação Extravagante", "text": "José foi contratado como estagiário, por processo seletivo simplificado, para atuar numa Delegacia de Polícia. Após ter acesso aos autos de certo inquérito policial, divulgou trecho de gravação indevidamente, sem relação com qualquer prova que se pretendia produzir, expondo a intimidade e a vida privada do investigado. Sobre o caso apresentado, analise as afirmativas a seguir. I. José, em razão de ser estagiário, não pode ser sujeito ativo dos crimes previstos na Lei de Abuso de Autoridade. II. José praticou crime previsto na Lei de Abuso de Autoridade, mas, por haver violação de intimidade do investigado, a ação penal será pública condicionada à representação do ofendido. III. As penas previstas na Lei de Abuso de Autoridade podem ser aplicadas a José independentemente das sanções de natureza civil ou administrativa cabíveis. Está correto o que se afirma em", "options": {"A": "I, apenas.", "B": "II, apenas.", "C": "III, apenas.", "D": "II e III, apenas.", "E": "I e II, apenas."}, "answer": "C", "needs_review": false}, {"id": 33, "subject": "Legislação Extravagante", "text": "Diante do que dispõe a Lei nº 13.869/2019, julgue as afirmações abaixo, indicando F, para a que for falsa, e V, para a verdadeira. ( ) As condutas descritas na Lei nº 13.869/2019 constituem crime de abuso de autoridade apenas nas hipóteses em que o agente as pratica por mero capricho ou satisfação pessoal. ( ) Configura crime a conduta do agente público que, por mero capricho ou satisfação pessoal, inovar artificiosamente, no curso de diligência, de investigação ou de processo, o estado de lugar, de coisa ou de pessoa, com o fim de eximir-se de responsabilidade ou de responsabilizar criminalmente alguém ou agravar-lhe a responsabilidade. ( ) Comete crime o agente público que, por satisfação pessoal, mantém presos de ambos os sexos na mesma cela ou espaço de confinamento. ( ) Incorre na prática de crime o agente público que, com a finalidade específica de beneficiar a terceiro, constrange, sob violência ou grave ameaça, funcionário ou empregado de instituição hospitalar pública ou privada a admitir para tratamento pessoa cujo óbito já tenha ocorrido, com o fim de alterar local ou momento de crime, prejudicando sua apuração. ( ) É sujeito ativo do crime de abuso de autoridade qualquer agente público, mas desde que seja servidor. A sequência correta de preenchimento dos parênteses, de cima para baixo, é:", "options": {"A": "F, V, F, V e F.", "B": "F, V, V, V e F.", "C": "V, F, V, V e F.", "D": "V, F, F, F e V.", "E": "F, F, V, V e V."}, "answer": "B", "needs_review": false}, {"id": 34, "subject": "Legislação Extravagante", "text": "De acordo com a Lei nº 13.869/2019, que versa sobre o abuso de autoridade, a sentença penal que reconhecer ter sido o ato praticado em estado de necessidade, em legítima defesa, em estrito cumprimento de dever legal ou no exercício regular de direito, em âmbito cível assim como no administrativo-disciplinar,", "options": {"A": "não faz coisa julgada no âmbito administrativo-disciplinar, mas faz coisa Julgada no âmbito cível; assim, deve-se prosseguir com a instrução do processo administrativo-disciplinar.", "B": "faz coisa julgada no âmbito administrativo-disciplinar, a sentença que reconhecer ter sido o ato praticado em legítima defesa, mas não em estrito cumprimento de dever legal ou no exercício regular de direito, mas não faz coisa julgada no âmbito cível.", "C": "faz coisa julgada.", "D": "não faz coisa julgada no âmbito cível e administrativo-disciplinar, pois são independentes; assim, deve se prosseguir com a instrução de ambos os processos.", "E": "não faz coisa julgada no âmbito cível, mas faz coisa Julgada no âmbito administrativo-disciplinar; assim, deve-se prosseguir com a instrução do processo cível."}, "answer": "C", "needs_review": false}, {"id": 35, "subject": "Legislação Extravagante", "text": "A Lei 13.869/2019 é relativa ao crime de Abuso de Autoridade. É sujeito ativo do crime de abuso de autoridade qualquer agente público, servidor ou não, da administração direta, indireta ou fundacional de qualquer dos Poderes da União, dos Estados, do Distrito Federal, dos Municípios e de Território, compreendendo, mas não se limitando aos servidores abaixo informados, exceto:", "options": {"A": "servidores públicos e militares ou pessoas a eles equiparadas;", "B": "membros do Poder Legislativo;", "C": "membros do Poder Executivo;", "D": "os prestadores de serviços notariais e de registro, particulares em colaboração com o Poder Público, por delegação;", "E": "membros do Poder Judiciário;"}, "answer": "D", "needs_review": false}, {"id": 36, "subject": "Legislação Extravagante", "text": "De acordo com a Lei 8069, de 13 de julho de 1990, que institui o Estatuto da Criança e do Adolescente, considera se criança a pessoa até 12 anos de idade incompletos, e adolescente aquela entre 12 e 18 anos de idade. Contudo, nos casos expressos em lei, aplica-se excepcionalmente este Estatuto às pessoas entre:", "options": {"A": "16 e 24 anos de idade.", "B": "16 e 25 anos de idade.", "C": "17 e 24 anos de idade.", "D": "18 e 24 anos de idade.", "E": "18 e 21 anos de idade."}, "answer": "E", "needs_review": false}, {"id": 37, "subject": "Legislação Extravagante", "text": "Todos os direitos e garantias previstos no ECA (Estatuto da Criança e do Adolescente) são direitos humanos, é dever da família, do poder público e da sociedade zelar pela proteção e pelo desenvolvimento pleno de crianças, adolescentes e jovens em qualquer lugar do Brasil. O artigo 53 do ECA, trata do direito à educação, sendo direito fundamental de crianças e adolescentes. Analise as alternativas e marque aquela que corresponde ao direito à educação, assegurado no artigo 53 previstos no ECA.", "options": {"A": "A Lei 8.069/90 passa a vigorar com as seguintes alterações: as crianças e adolescentes podem ser educadas e cuidadas, com uso de castigos físicos e degradantes, como forma de correção, disciplina e educação.", "B": "É direito do adolescente, trabalhar como aprendiz, no turno noturno, realizado entre as vinte e duas horas de um dia e as cinco horas do dia seguinte", "C": "Todas as crianças e adolescentes têm direito de participar da elaboração e definição da proposta curricular do estado e dos municípios.", "D": "Acesso à escola pública e gratuita, próxima de sua residência, garantindo-se vagas no mesmo estabelecimento a irmãos que frequentem a mesma etapa ou ciclo de ensino da educação básica."}, "answer": "D", "needs_review": false}, {"id": 38, "subject": "Legislação Extravagante", "text": "Sobre a privação de liberdade na adolescência, considerado o ECA (Lei n.º 8.069/1990), é correto afirmar, EXCETO:", "options": {"A": "A apreensão de qualquer adolescente e o local onde se encontra recolhido serão imediatamente comunicados à autoridade judiciária competente e à família do apreendido ou à pessoa por ele indicada.", "B": "O adolescente tem direito à identificação dos responsáveis pela sua apreensão, devendo ser informado acerca de seus direitos.", "C": "A internação do adolescente, antes da sentença, pode ser determinada pelo prazo máximo de quarenta e cinco dias.", "D": "Nenhum adolescente será privado de sua liberdade.", "E": "Para efeito de confrontação, havendo dúvida fundada, o adolescente civilmente identificado será submetido a identificação compulsória pelos órgãos policiais, de proteção e judiciais."}, "answer": "D", "needs_review": false}, {"id": 39, "subject": "Legislação Extravagante", "text": "Não é proibido vender para a criança ou adolescente:", "options": {"A": "Armas, munições e explosivos.", "B": "Bebidas alcoólicas.", "C": "Estalinhos.", "D": "Revistas e publicações contendo material impróprio ou inadequado a crianças e adolescentes"}, "answer": "C", "needs_review": false}, {"id": 40, "subject": "Legislação Extravagante", "text": "Sobre a Lei nº 8.089, de 13 de julho de 1990, que dispõe sobre o Estatuto da Criança e do Adolescente, é CORRETO afirmar que se considera criança, para os efeitos dessa Lei,", "options": {"A": "a pessoa até doze anos de idade incompletos, e adolescente aquela entre doze e dezoito anos de idade.", "B": "a pessoa até dez anos de idade, e adolescentes aquela entre onze e dezesseis anos de idade.", "C": "a pessoa até doze anos de idade, e adolescentes aquela entre onze e dezesseis anos de idade.", "D": "a pessoa até onze anos de idade incompletos e adolescentes aquela entre doze e dezenove anos de idade.", "E": "a pessoa até doze anos de idade completos, e adolescentes aquela entre doze e dezenove anos de idade."}, "answer": "A", "needs_review": false}, {"id": 41, "subject": "Legislação Extravagante", "text": "Dentre as formas de violência doméstica e familiar contra a mulher, expressamente previstas na Lei nº 11.340/06, NÃO figura a violência", "options": {"A": "psicológica.", "B": "patrimonial.", "C": "moral.", "D": "endêmica.", "E": "sexual."}, "answer": "D", "needs_review": false}, {"id": 42, "subject": "Legislação Extravagante", "text": "Segundo a Lei Maria da Penha, configura-se violência doméstica e familiar contra a mulher, qualquer ação ou omissão que lhe cause morte, lesão, sofrimento físico, sexual ou psicológico, dano moral ou patrimonial. Uma das medidas que o juiz poderá determinar para proteger os bens patrimoniais da sociedade conjugal ou de propriedade particular da mulher é", "options": {"A": "restituição à ofendida dos bens devidamente subtraídos pelo agressor.", "B": "proibição por tempo indeterminado para a celebração de atos e contratos de compra, venda e locação de propriedade em comum.", "C": "suspensão das procurações conferidas pela ofendida ao agressor.", "D": "prestação de caução provisória, mediante depósito em conta corrente por perdas e danos materiais decorrentes da prática de violência contra a ofendida.", "E": "determinação da permanência da ofendida no lar, sem prejuízo dos direitos relativos a bens, guarda dos filhos e alimento."}, "answer": "C", "needs_review": false}, {"id": 43, "subject": "Legislação Extravagante", "text": "São medidas protetivas de urgência (i) expressamente previstas na Lei nº 11.340/06 em favor da mulher vítima de violência doméstica e (ii) que obrigam o agressor, EXCETO:", "options": {"A": "prestação de alimentos provisionais ou provisórios;", "B": "suspensão da posse ou restrição do porte de armas;", "C": "restrição ou suspensão de visitas aos dependentes menores;", "D": "proibição de contato com a ofendida, seus familiares e testemunhas por qualquer meio de comunicação;", "E": "comparecimento pessoal e obrigatório a juízo, mensalmente, para informar e justificar suas atividades."}, "answer": "E", "needs_review": false}, {"id": 44, "subject": "Legislação Extravagante", "text": "No caso da Lei Maria da Penha, é correto dizer que", "options": {"A": "para sua aplicação deve estar configurada uma condição de subjugação da mulher vitimizada ao homem.", "B": "a jurisprudência tem se consolidado no sentido de estender a aplicação dessa lei às relações homoafetivas.", "C": "de acordo com essa Lei, medidas protetivas serão concedidas mediante registro de boletim de ocorrência em Delegacia da Mulher", "D": "essa Lei não se aplica a relações familiares não conjugais, como no caso de relacionamentos mãe-filho."}, "answer": "B", "needs_review": false}, {"id": 45, "subject": "Legislação Extravagante", "text": "São exemplos de medidas protetivas elencadas pela Lei Maria da Penha:", "options": {"A": "Restrição do porte de armas e afastamento do lar.", "B": "Sujeição a acompanhamento profissional visando à aproximação entre o acusado e a ofendida, seus familiares e testemunhas.", "C": "Garantia de visitas do agressor aos dependentes menores.", "D": "Comparecimento da ofendida e do agressor em programas de reeducação.", "E": "Concessão de auxílio-aluguel ao agressor, se carente financeiramente."}, "answer": "A", "needs_review": false}, {"id": 46, "subject": "Legislação Extravagante", "text": "A proteção dos direitos das mulheres brasileiras tem como importante marco a Lei Maria da Penha, que cria mecanismos para coibir violências dos mais diversos tipos contra as mulheres. Sobre a Lei Maria da Penha, assinale a alternativa correta.", "options": {"A": "Embora seja passível de ocorrer em situações reais, a Lei Maria da Penha optou por não tratar de violência psicológica, por ser de definição subjetiva.", "B": "Para que se configure a violência doméstica e familiar contra a mulher, é necessário que o autor seja do sexo masculino e que o ato de agressão ocorra dentro da residência em que os dois habitam.", "C": "Caso a vítima de violência doméstica e familiar seja servidora pública, para preservar sua integridade física e psicológica, o juiz lhe assegurará acesso prioritário à remoção.", "D": "A Lei Maria da Penha não prevê a implementação de atendimento policial especializado para as mulheres, tampouco a criação de Delegacias de Atendimento à Mulher."}, "answer": "C", "needs_review": false}, {"id": 47, "subject": "Legislação Extravagante", "text": "Conforme a Lei Maria da Penha, assinale a alternativa correta.", "options": {"A": "As medidas protetivas de urgência vigorarão enquanto persistir risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida ou de seus dependentes.", "B": "As medidas protetivas de urgência vigorarão apenas por 30 dias, prorrogáveis por igual período, para os casos de risco à integridade psicológica.", "C": "As medidas protetivas de urgência vigorarão apenas por 30 dias, não prorrogáveis por igual período, para os casos de risco à integridade patrimonial.", "D": "As medidas protetivas de urgência vigorarão enquanto persistir risco à integridade física, psicológica, sexual, patrimonial ou moral da ofendida e por 24h para seus dependentes.", "E": "As medidas protetivas de urgência vigorarão enquanto persistir risco e houver a concordância do agressor por escrito."}, "answer": "A", "needs_review": false}, {"id": 48, "subject": "Legislação Extravagante", "text": "Sobre a “Lei Maria da Penha”, assinale a alternativa INCORRETA.", "options": {"A": "A assistência à mulher em situação de violência doméstica e familiar será prestada de forma articulada e conforme os princípios e as diretrizes previstos na Lei Orgânica da Assistência Social, no Sistema Único de Saúde, no Sistema Único de Segurança Pública, entre outras normas e políticas públicas de proteção e emergencialmente quando for o caso.", "B": "O juiz determinará, por prazo indeterminado, a inclusão da mulher em situação de violência doméstica e familiar no cadastro de programas assistenciais do governo federal, estadual e municipal.", "C": "O juiz assegurará à mulher em situação de violência doméstica e familiar, para preservar sua integridade física e psicológica, a manutenção do vínculo trabalhista, e, quando necessário, o afastamento do local de trabalho, por até 6 meses.", "D": "A assistência à mulher em situação de violência doméstica e familiar compreenderá o acesso aos benefícios decorrentes do desenvolvimento científico e tecnológico, incluindo os serviços de contracepção de emergência, a profilaxia das Doenças Sexualmente Transmissíveis (DST) e da Síndrome da Imunodeficiência Adquirida (AIDS) e outros procedimentos médicos necessários e cabíveis nos casos de violência sexual.", "E": "A política pública que visa coibir a violência doméstica e familiar contra a mulher far se-á por meio de um conjunto articulado de ações da União, dos Estados, do Distrito Federal e dos Municípios e de ações não governamentais, tendo por diretrizes, dentre outras, o respeito, nos meios de comunicação social, aos valores éticos e sociais da pessoa e da família, de forma a coibir os papéis estereotipados, que legitimem ou exacerbem a violência doméstica e familiar."}, "answer": "B", "needs_review": false}, {"id": 49, "subject": "Legislação Extravagante", "text": "Suponha que o agente X foi flagrado por guardas municipais durante patrulhamento de rotina próximo a uma escola municipal. Ele trazia consigo 100 (cem) porções de substância esverdeada semelhante à maconha. Indagado, o agente permaneceu calado. Os guardas então conduziram o agente à presença do delegado de polícia, que determinou a apreensão das substâncias e a realização de exame pericial. Posteriormente ficou constatado pela perícia ser aquela substância tetra hidrocanabinol (THC), conhecida como maconha, substância proibida segundo lista da Anvisa (Portaria/SVS/MS 344). Diante dessa situação, é possível afirmar que o agente X responde pelo crime de:", "options": {"A": "roubo.", "B": "epidemia.", "C": "estelionato.", "D": "tráfico de drogas.", "E": "omissão de notificação de doença."}, "answer": "D", "needs_review": false}, {"id": 50, "subject": "Legislação Extravagante", "text": "Epitácio, brasileiro naturalizado, cometera crime de tráfico ilícito de drogas, na Itália, antes de sua naturalização. Considerando que: 1) A Itália requereu sua extradição ao Brasil; 2) Epitácio casou-se com uma brasileira nata e deste relacionamento adveio um filho, assinale a alternativa correta.", "options": {"A": "Configura o caso hipótese de deportação. Diferentemente da extradição e da expulsão, a deportação é a entrega por um Estado a outro, a requerimento deste, de pessoa que nele deva respondera processo penal ou cumprir pena.", "B": "A CRFB/88 veda expressamente a extradição de brasileiro naturalizado em caso de crime comum praticado antes da naturalização, ou de comprovado envolvimento em tráfico ilícito de drogas.", "C": "O STF, em reiteradas decisões, decidiu que s constituição de filho brasileiro impede a extradição, em observância ao princípio do melhor interesse do menor.", "D": "A hipótese narrada, no caso em tela, é de expulsão, tendo em vista que a CRFB/88 não permite que brasileiro naturalizado tenha cometido crime, por se tornar nocivo à conveniência e aos interesses nacionais.", "E": "Epitácio poderá ser extraditado, tendo em vista que não impede a extradição a circunstância de ser o extraditado casado com brasileira ou ter filho brasileiro."}, "answer": "E", "needs_review": false}];
const availableQuestions=questions.filter(q=>!q.needs_review);
const key='duelo-simulado-v1',revKey='duelo-revisoes-v1';
let profile='pai',tab='home',subject='Todas',current=availableQuestions[0].id,choice=null,feedback=false,review=null,reviewAnswers=[];
const app=document.getElementById('app');
function esc(v){return String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function get(){try{let x=JSON.parse(localStorage.getItem(key));return x&&x.filho&&x.pai?x:{filho:[],pai:[]}}catch{return {filho:[],pai:[]}}}
function put(x){localStorage.setItem(key,JSON.stringify(x))}
function getR(){try{let x=JSON.parse(localStorage.getItem(revKey));return x&&x.filho&&x.pai?x:{filho:[],pai:[]}}catch{return {filho:[],pai:[]}}}
function putR(x){localStorage.setItem(revKey,JSON.stringify(x))}
function history(id,p=profile){return get()[p].filter(a=>a.id===id)}
function stat(p){let a=get()[p].filter(x=>x.id!==3),first=a.filter((x,i)=>a.findIndex(y=>y.id===x.id)===i);let reviews=getR()[p];return {total:first.length,correct:first.filter(x=>x.correct).length,wrong:first.filter(x=>!x.correct).length,reviewPoints:reviews.filter(x=>x.correct===3).length,reviews:reviews.length,reviewed:reviews.length*3}}
function go(t){tab=t;feedback=false;render()}
function setProfile(p){profile=p;review=null;go('home')}
function openQ(id){if(!availableQuestions.some(q=>q.id===id))return;current=id;choice=null;feedback=false;go('questions')}
function submit(){let q=questions.find(x=>x.id===current);if(!q||q.needs_review||!choice)return;let x=get();x[profile].push({id:q.id,selected:choice,correct:choice===q.answer,at:new Date().toISOString()});put(x);feedback=true;render()}
function startReview(){let mistakes=questions.filter(q=>!q.needs_review&&history(q.id).some(a=>!a.correct));if(!mistakes.length){review=null;go('review');return}let groups=[...new Set(mistakes.map(q=>q.subject))];let topic=groups[Math.floor(Math.random()*groups.length)];let pool=availableQuestions.filter(q=>q.subject===topic&&!q.needs_review);let unique=[...new Map(pool.map(q=>[q.text,q])).values()];let incorrect=unique.filter(q=>mistakes.some(m=>m.id===q.id));let picked=[...incorrect,...unique.filter(q=>!incorrect.includes(q))].slice(0,3);if(picked.length<3){review=null;go('review');return}review={topic,items:picked};reviewAnswers=[];go('review')}
function answerReview(i,a){if(!review||reviewAnswers[i]!==undefined)return;reviewAnswers[i]=a; if(reviewAnswers.filter(x=>x!==undefined).length===3){let correct=review.items.filter((q,j)=>reviewAnswers[j]===q.answer).length;let x=getR();x[profile].push({subject:review.topic,ids:review.items.map(q=>q.id),correct,at:new Date().toISOString()});putR(x)}render()}
function profileBar(){return '<div class="profiles">'+[['pai','Alexandre Pai'],['filho','Alexandre Filho']].map(([p,n])=>'<button class="'+(p===profile?'active':'')+'" onclick="setProfile(\''+p+'\')">'+n+'</button>').join('')+'</div>'}
function score(){let p=stat('pai'),f=stat('filho'),pt=p.correct+p.reviewPoints,ft=f.correct+f.reviewPoints;return '<section class="panel"><h2>🏆 Placar do duelo</h2><div class="score"><div class="side"><div class="muted">Alexandre Pai</div><div class="num">'+pt+' <span class="pill">pts</span></div><div class="sub">'+p.correct+' normais + '+p.reviewPoints+' revisão</div></div><div class="vs">⚔ VS</div><div class="side"><div class="muted">Alexandre Filho</div><div class="num">'+ft+' <span class="pill">pts</span></div><div class="sub">'+f.correct+' normais + '+f.reviewPoints+' revisão</div></div></div><div class="track"><span style="width:'+(pt+ft?Math.round(pt/(pt+ft)*100):50)+'%"></span></div></section>'}
function render(){let s=stat(profile);let head=profileBar();
if(tab==='home'){app.innerHTML=head+score()+'<div class="tiles"><button class="tile" onclick="go(\'questions\')"><span class="ico">📖</span><strong>Resolver questões</strong><small>Iniciar simulado</small></button><button class="tile" onclick="go(\'review\')"><span class="ico">🧠</span><strong>Revisão inteligente</strong><small>3 acertos = 1 ponto</small></button><button class="tile" onclick="go(\'performance\')"><span class="ico">📊</span><strong>Meu desempenho</strong><small>Pontuação e evolução</small></button><button class="tile" onclick="go(\'errors\')"><span class="ico">📕</span><strong>Caderno de erros</strong><small>Revisar dificuldades</small></button></div>';return}
let back='<button class="back" onclick="go(\'home\')">← Voltar ao painel</button>';
if(tab==='performance'){let entries=getR()[profile];app.innerHTML=head+back+'<section class="panel"><h2>📊 Meu desempenho</h2><div class="stats"><div class="stat"><strong>'+s.total+'</strong><small>Resolvidas</small></div><div class="stat"><strong>'+s.correct+'</strong><small>Acertos normais</small></div><div class="stat"><strong>'+s.correct+s.reviewPoints+'</strong><small>Pontos totais</small></div></div><h2 style="margin-top:20px">🧠 Histórico de revisões</h2><div class="stats"><div class="stat"><strong>'+s.reviewed+'</strong><small>Revisadas</small></div><div class="stat"><strong>'+entries.reduce((n,x)=>n+x.correct,0)+'</strong><small>Acertos</small></div><div class="stat"><strong>+'+s.reviewPoints+'</strong><small>Pontos ganhos</small></div></div>'+ (entries.length?entries.slice().reverse().map(x=>'<div class="history"><div class="row"><strong>'+esc(x.subject)+'</strong><strong class="'+(x.correct===3?'ok':'bad')+'">'+x.correct+'/3 · '+(x.correct===3?'+1 ponto':'0 pontos')+'</strong></div><div class="sub">'+new Date(x.at).toLocaleDateString('pt-BR')+'</div></div>').join(''):'<p class="muted">Nenhuma revisão concluída ainda.</p>')+'</section>';return}
if(tab==='errors'){let q=questions.filter(q=>!q.needs_review&&history(q.id).some(a=>!a.correct));app.innerHTML=head+back+'<section class="panel"><h2>📕 Caderno de erros</h2><p class="muted">Os erros permanecem no histórico mesmo depois de um acerto.</p>'+(q.length?q.map(x=>'<div class="history"><strong>Questão '+x.id+' · '+esc(x.subject)+'</strong><div class="sub">'+history(x.id).filter(a=>!a.correct).length+' erro(s) · '+history(x.id).filter(a=>a.correct).length+' acerto(s)</div><button class="secondary" onclick="openQ('+x.id+')">Refazer questão</button></div>').join('')+'<button class="primary" onclick="startReview()">Iniciar revisão do conteúdo</button>':'<p>Nenhum erro registrado.</p>')+'</section>';return}
if(tab==='review'){let mistakes=questions.filter(q=>!q.needs_review&&history(q.id).some(a=>!a.correct));let finished=review&&reviewAnswers.filter(x=>x!==undefined).length===3;app.innerHTML=head+back+'<section class="panel"><h2>🧠 Revisão inteligente</h2><p class="muted">Para ganhar +1 ponto, acerte as três questões do bloco. Os pontos entram no placar geral.</p>'+(!review?'<p>'+(mistakes.length?'Pronto para revisar os assuntos em que você errou.':'Resolva algumas questões primeiro. Seus erros vão orientar as revisões.')+'</p><button class="primary" '+(!mistakes.length?'disabled':'')+' onclick="startReview()">Começar revisão</button>':'<div><p class="sub">Assunto: '+esc(review.topic)+'</p>'+review.items.map((q,i)=>'<div class="history"><strong>Questão '+(i+1)+' de 3</strong><p class="qtext">'+esc(q.text)+'</p>'+Object.entries(q.options).map(([k,v])=>'<label class="option"><input type="radio" name="r'+i+'" '+(reviewAnswers[i]!==undefined?'disabled':'')+' onchange="answerReview('+i+',\''+k+'\')" '+(reviewAnswers[i]===k?'checked':'')+'> '+k+') '+esc(v)+'</label>').join('')+(reviewAnswers[i]!==undefined?'<p class="'+(reviewAnswers[i]===q.answer?'ok':'bad')+'">'+(reviewAnswers[i]===q.answer?'Acertou!':'Errou. Resposta correta: '+q.answer)+'</p>':'')+'</div>').join('')+(finished?'<div class="result"><strong>'+review.items.filter((q,i)=>reviewAnswers[i]===q.answer).length+' de 3 acertos · '+(review.items.every((q,i)=>reviewAnswers[i]===q.answer)?'+1 ponto':'0 pontos')+'</strong><p class="sub">Resultado salvo no histórico de revisões.</p><button class="primary" onclick="startReview()">Nova revisão</button></div>':'')+'</div>')+'<p class="notice">As revisões usam questões existentes do simulado sobre o assunto. A geração de perguntas inéditas por IA ainda não está disponível.</p></section>';return}
let pool=availableQuestions.filter(q=>subject==='Todas'||q.subject===subject);if(!pool.some(q=>q.id===current))current=pool[0].id;let q=questions.find(q=>q.id===current),last=history(q.id).at(-1);app.innerHTML=head+back+'<section class="panel"><h2>📖 Resolver questões</h2><select class="subject" onchange="subject=this.value;current=availableQuestions.find(q=>subject===\'Todas\'||q.subject===subject).id;choice=null;feedback=false;render()">'+['Todas',...new Set(availableQuestions.map(q=>q.subject))].map(x=>'<option '+(subject===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select><div class="nums">'+pool.map(x=>'<button class="'+(x.id===current?'active':'')+'" onclick="openQ('+x.id+')">'+x.id+'</button>').join('')+'</div></section><section class="panel"><h2>Questão '+q.id+'</h2><div class="sub">'+esc(q.subject)+'</div><p class="qtext">'+esc(q.text)+'</p>'+Object.entries(q.options).map(([k,v])=>'<label class="option"><input type="radio" name="answer" '+(choice===k?'checked':'')+' '+(feedback?'disabled':'')+' onchange="choice=\''+k+'\'"> '+k+') '+esc(v)+'</label>').join('')+(feedback?'<div class="result"><strong class="'+(last.correct?'ok':'bad')+'">'+(last.correct?'Acertou!':'Errou!')+'</strong><p>Gabarito informado: '+q.answer+'</p><p class="sub">Explicações detalhadas ainda serão adicionadas após conferência do conteúdo.</p><button class="secondary" onclick="openQ('+q.id+')">Tentar novamente</button></div>':'<button class="primary" onclick="submit()">Corrigir e registrar</button>')+'<p class="notice">Histórico: '+history(q.id).filter(a=>!a.correct).length+' erro(s) e '+history(q.id).filter(a=>a.correct).length+' acerto(s). O placar normal considera a primeira tentativa.</p></section>';
}
render();
</script></body></html>
